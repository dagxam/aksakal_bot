                      city for city in AksakalBot.CITY_NAMES
                      if AksakalBot.normalize_city_name(city).startswith(required)
                      and AksakalBot.normalize_city_name(city) not in used
                  )
                  await bot.handle_city_guess(chat_id, 2, "Магомед", city_answer, "message")
                  assert db.game_session_top(chat_id, "cities")[0]["score"] == 1
                  await bot.stop_specific_game(chat_id, "cities")
                  await asyncio.sleep(0)

                  # Виселица: целое слово засчитывается.
                  await bot.start_hangman_game(chat_id)
                  assert bot.active_game(chat_id) == "hangman"
                  hang = db.get_hangman_game(chat_id)
                  await bot.handle_hangman_guess(chat_id, 3, "Расул", hang["word"], "message")
                  assert db.game_session_top(chat_id, "hangman")[0]["score"] == 1
                  await bot.stop_specific_game(chat_id, "hangman")
                  await asyncio.sleep(0)

                  # Викторина: текст правильного ответа засчитывается.
                  await bot.start_quiz_game(chat_id)
                  assert bot.active_game(chat_id) == "quiz"
                  quiz = db.get_quiz_game(chat_id)
                  await bot.handle_quiz_guess(chat_id, 4, "Патимат", quiz["answer"], "message")
                  assert db.game_session_top(chat_id, "quiz")[0]["score"] == 1
                  await bot.stop_specific_game(chat_id, "quiz")
                  await asyncio.sleep(0)

                  # Кто я?: точный ответ засчитывается.
                  await bot.start_whoami_game(chat_id)
                  assert bot.active_game(chat_id) == "whoami"
                  who = db.get_whoami_game(chat_id)
                  await bot.handle_whoami_guess(chat_id, 5, "Мурад", who["answer"], "message")
                  assert db.game_session_top(chat_id, "whoami")[0]["score"] == 1
                  await bot.stop_specific_game(chat_id, "whoami")
                  await asyncio.sleep(0)

                  assert len(bot.tg.messages) >= 10
              finally:
                  for suffix in ("", "-shm", "-wal"):
                      try:
                          os.remove(path + suffix)
                      except FileNotFoundError:
                          pass

          asyncio.run(main())
          print("live game engines smoke test OK")
          PY

