name: Python check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile bot.py config.py db.py generator.py
      - name: Smoke test generator signature
        run: |
          python - <<'PY'
          import inspect
          from generator import PhraseGenerator
          sig = inspect.signature(PhraseGenerator.generate)
          required = {
              "recent_bot_replies", "relevant_memory", "source_text", "source_kind",
              "user_profile", "thread_context", "humor_style", "manual_feedback_examples",
          }
          missing = required - set(sig.parameters)
          assert not missing, f"Missing generator parameters: {missing}"
          import asyncio
          g = PhraseGenerator(
              enabled=False,
              groq_api_key="",
              groq_models="openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b",
          )
          assert "AI НЕ НАСТРОЕН" in g.provider_status()

          async def main():
              text = await g.generate(
                  target={"display_name": "Магомед", "style_profile": "male"},
                  context=[{"kind": "message", "content": "Купил машину", "display_name": "Магомед"}],
                  level=3,
                  reason="test",
                  source_text="Купил машину",
                  source_kind="message",
                  recent_bot_replies=["Магомед — старый ответ."],
                  relevant_memory=[{"display_name": "Магомед", "content": "Раньше говорил про машину"}],
              )
              assert text == "", text
          asyncio.run(main())
          print("generator smoke test OK")
          PY

      - name: Smoke test database and bot wiring
        run: |
          python - <<'PY'
          import os
          import tempfile
          from db import Database
          from bot import AksakalBot

          fd, path = tempfile.mkstemp(suffix=".db")
          os.close(fd)
          try:
              db = Database(path)
              db.ensure_chat(-100123, "Тест", 3, 10, 180)
              db.update_chat(-100123, response_delay_seconds=3, hardness_mode="fixed", fixed_hardness=5)
              chat = db.get_chat(-100123)
              assert chat["response_delay_seconds"] == 3
              assert chat["fixed_hardness"] == 5
              assert chat["game_difficulty"] == "normal"
              db.update_chat(-100123, game_difficulty="hard")
              chat = db.get_chat(-100123)
              assert chat["game_difficulty"] == "hard"

              ali = {"id": 7, "username": "ali", "first_name": "Али"}
              ali_id = db.touch_user(-100123, ali, "message")
              db.add_message(-100123, 1, ali_id, "ali", "Али", "message", "Вчера говорил про машину")

              user = {"id": 42, "username": "testuser", "first_name": "Магомед"}
              uid = db.touch_user(-100123, user, "message")
              assert uid == 42
              db.add_message(
                  -100123, 2, uid, "testuser", "Магомед", "message", "Купил новую машину",
                  reply_to_message_id=1, reply_to_user_id=ali_id,
              )
              db.learn_tokens(-100123, uid, ["машина", "машина", "новая машина"])
              db.add_bot_message(-100123, 3, "Тестовый ответ", reply_to_message_id=2, reply_to_user_id=uid)

              assert db.recent_context(-100123, 10)
              assert db.recent_bot_replies(-100123, 5)
              memory = db.relevant_messages(-100123, "Купил машину", 5)
              assert memory, "Russian inflection-aware memory lookup returned nothing"
              assert any("Вчера говорил про машину" in x["content"] for x in memory)

              thread = db.message_thread(-100123, 2, 8)
              assert [x["telegram_message_id"] for x in thread] == [1, 2]
              assert thread[-1]["reply_to_user_id"] == ali_id

              profile = db.user_profile_summary(-100123, uid)
              assert profile["message_count"] >= 1
              assert any(x["display_name"] == "Али" for x in profile["frequent_reply_targets"])

              db.record_humor_style(-100123, uid, "dry")
              assert db.recent_humor_styles(-100123, uid, 3)[0] == "dry"

              db.register_bot_response(-100123, 3, uid, "dry", 3)
              assert db.get_bot_response(-100123, 3)["humor_style"] == "dry"
              db.set_response_feedback(-100123, 3, ali_id, "reaction", 1, "😂")
              prefs = db.humor_style_preferences(-100123, uid)
              assert prefs["dry"] > 0
              stats = db.feedback_stats(-100123)
              assert stats["signals"] == 1

              # Обновление той же реакции не создаёт второй сигнал.
              db.set_response_feedback(-100123, 3, ali_id, "reaction", -1, "👎")
              stats2 = db.feedback_stats(-100123)
              assert stats2["signals"] == 1
              assert db.humor_style_preferences(-100123, uid)["dry"] < 0

              # Ручная тишина хранится в БД и переживает перезапуск процесса.
              db.update_chat(-100123, manual_quiet=1)
              assert db.get_chat(-100123)["manual_quiet"] == 1
              db.update_chat(-100123, manual_quiet=0)
              assert db.get_chat(-100123)["manual_quiet"] == 0

              # Исключённый участник не попадает в цели автоматических реплик.
              db.set_ignored_user(-100123, ali_id, True, added_by=uid)
              assert db.is_ignored_user(-100123, ali_id)
              assert ali_id not in {int(x["user_id"]) for x in db.active_users(-100123, 30 * 86400)}
              assert all(int(x.get("user_id") or 0) != ali_id for x in db.recent_context(-100123, 20))
              assert not any(
                  int(x.get("user_id") or 0) == ali_id
                  for x in db.relevant_messages(-100123, "машина", 20)
              )
              ignored = db.ignored_users(-100123)
              assert ignored and int(ignored[0]["user_id"]) == ali_id
              db.set_ignored_user(-100123, ali_id, False, added_by=uid)
              assert not db.is_ignored_user(-100123, ali_id)

              # Разговорная пауза распознаётся без slash-команды.
              for phrase in (
                  "помолчи",
                  "Аксакал, помолчи",
                  "молчи пока",
                  "остановись",
                  "Аксакал остановись",
                  "прекрати",
                  "подожди",
                  "хватит",
                  "отдохни немного",
              ):
                  assert AksakalBot.is_quiet_request(phrase), phrase

              for phrase in (
                  "он сказал мне помолчи",
                  "подожди меня возле дома",
                  "прекрати спорить с ним",
                  "хватит ли нам еды",
              ):
                  assert not AksakalBot.is_quiet_request(phrase), phrase

              for phrase in (
                  "Аксакал где ты",
                  "акскал где ты",
                  "Аксакал не молчи",
                  "акскал вернись",
                  "Аксакал ты тут",
              ):
                  assert AksakalBot.is_wake_request(phrase), phrase

              db.set_response_feedback(-100123, 3, ali_id, "admin", 2, "admin_good")
              manual = db.manual_feedback_examples(-100123, uid, 5)
              assert manual
              assert manual[0]["score"] == 2
              assert "Тестовый ответ" in manual[0]["content"]

              db.set_response_feedback(-100123, 3, ali_id, "admin", -2, "admin_bad")
              manual2 = db.manual_feedback_examples(-100123, uid, 5)
              assert manual2[0]["score"] == -2

              kb = AksakalBot.settings_keyboard(chat)
              callbacks = [
                  btn["callback_data"]
                  for row in kb["inline_keyboard"]
                  for btn in row
              ]
              assert "set:hard:normal" in callbacks
              assert "set:hard:angry" in callbacks
              assert "set:hard:super" in callbacks
              assert "set:time:0" in callbacks
              assert "set:time:3" in callbacks
              assert "set:bot:on" in callbacks
              assert "set:bot:off" in callbacks
              assert "set:gamelevel:easy" in callbacks
              assert "set:gamelevel:normal" in callbacks
              assert "set:gamelevel:hard" in callbacks

              # Игровой центр и рейтинг не смешиваются с настройками,
              # но глобальная сложность игр теперь настраивается здесь.
              assert not any(x.startswith("set:silence:") for x in callbacks)
              assert not any(x.startswith("set:game:") for x in callbacks)
              assert not any(x.startswith("set:rating:") for x in callbacks)

              bot_for_level = object.__new__(AksakalBot)
              bot_for_level.db = db
              assert bot_for_level.game_difficulty(-100123) == 3
              assert bot_for_level.game_difficulty_label(-100123) == "Сложный"
              assert set(AksakalBot.QUIZ_LEVELS) == {1, 2, 3}
              quiz_ids = {q["id"] for q in AksakalBot.QUIZ_QUESTIONS}
              assert all(set(ids) <= quiz_ids for ids in AksakalBot.QUIZ_LEVELS.values())
              assert all(AksakalBot.CROCODILE_LEVELS[level] for level in (1, 2, 3))

              settings_text = AksakalBot.settings_text(chat)
              assert "Жёсткость:" in settings_text
              assert "Время ответа:" in settings_text
              assert "Сложность игр: Сложный" in settings_text
              assert "Состояние:" in settings_text
              assert "Оживление группы" not in settings_text
              print("database/bot smoke test OK")
          finally:
              for suffix in ("", "-shm", "-wal"):
                  try:
                      os.remove(path + suffix)
                  except FileNotFoundError:
                      pass
          PY

      - name: Meta-leak filter smoke test
        run: |
          python - <<'PY'
          from generator import PhraseGenerator
          assert hasattr(PhraseGenerator, "detect_mode")
          normal = PhraseGenerator.detect_mode(
              [{"kind":"message","content":"Как лучше поступить в этой ситуации?"}],
              mood="wise",
              source_text="Как лучше поступить в этой ситуации?",
          )
          angry = PhraseGenerator.detect_mode(
              [{"kind":"message","content":"Мозгов нет да у тебя"}],
              mood="playful",
              source_text="Мозгов нет да у тебя",
          )
          assert normal == 1
          assert angry in {3,5}
          print("mode selection smoke test OK")
          PY

      - name: Question routing smoke test
        run: |
          python - <<'PY'
          from generator import PhraseGenerator
          assert PhraseGenerator.is_information_question("Как работает редстоун в Minecraft?")
          assert PhraseGenerator.is_information_question("Почему море солёное?")
          assert PhraseGenerator.is_information_question("Подскажи как настроить сервер")
          assert not PhraseGenerator.is_information_question("Мозгов нет у тебя, да?")
          assert PhraseGenerator.detect_mode([], mood="playful", source_text="Как работает двигатель?") == 1
          print("question routing smoke test OK")
          PY

      - name: Humor strategy smoke test
        run: |
          python - <<'PY'
          from generator import PhraseGenerator
          style = PhraseGenerator.choose_humor_style(
              "Опять ты про эту машину",
              ["dry", "logic", "analogy"],
              mood="playful",
              level=3,
              has_memory=True,
              style_preferences={"callback": 4.0, "wordplay": -3.0},
          )
          assert style not in {"dry", "logic", "analogy"}
          assert style == "callback"
          assert PhraseGenerator.choose_humor_style(
              "Почему море солёное?",
              [],
              mood="playful",
              level=1,
              has_memory=False,
          ) == "none"
          print("humor strategy smoke test OK")
          PY

      - name: Feedback scoring smoke test
        run: |
          python - <<'PY'
          from bot import AksakalBot
          assert AksakalBot.reaction_feedback_score(["😂", "🔥"]) == 2
          assert AksakalBot.reaction_feedback_score(["👎"]) == -1
          assert AksakalBot.reaction_feedback_score([]) == 0
          assert AksakalBot.reply_feedback_score("ахах, точно") == 2
          assert AksakalBot.reply_feedback_score("что за бред, не смешно") == -1
          assert AksakalBot.reply_feedback_score("а почему так?") == 1
          print("feedback scoring smoke test OK")
          PY

      - name: Instant reply and attack detection smoke test
        run: |
          python - <<'PY'
          from bot import AksakalBot

          assert AksakalBot.looks_like_attack("Мозгов нет да у тебя")
          assert AksakalBot.looks_like_attack("Ты что, тупой?")
          assert not AksakalBot.looks_like_attack("Как у тебя дела?")

          chat = {
              "hardness_mode": "auto",
              "fixed_hardness": 3,
              "response_delay_seconds": 0,
              "silence_minutes": 30,
              "enabled": 1,
          }
          kb = AksakalBot.settings_keyboard(chat)
          callbacks = [
              button["callback_data"]
              for row in kb["inline_keyboard"]
              for button in row
          ]
          assert "set:time:0" in callbacks
          assert "set:bot:on" in callbacks
          assert "set:bot:off" in callbacks
          assert not any(x.startswith("set:silence:") for x in callbacks)
          assert "✅ ⚡ Сразу" in [
              button["text"]
              for row in kb["inline_keyboard"]
              for button in row
          ]
          print("instant/attack smoke test OK")
          PY

      - name: Command cleanup and free AI wiring smoke test
        run: |
          python - <<'PY'
          import inspect
          from bot import AksakalBot, TelegramAPI
          from generator import PhraseGenerator

          sig = inspect.signature(PhraseGenerator.__init__)
          assert "groq_models" in sig.parameters
          assert "mistral_api_key" in sig.parameters
          assert "mistral_model" in sig.parameters
          assert "gemini_api_key" not in sig.parameters
          assert "openrouter_api_key" not in sig.parameters
          assert hasattr(TelegramAPI, "delete")
          assert hasattr(AksakalBot, "send_command_notice")
          assert hasattr(AksakalBot, "safe_delete_message")

          g = PhraseGenerator(
              enabled=True,
              groq_api_key="test",
              groq_models="openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b",
              mistral_api_key="test",
              mistral_model="mistral-small-latest",
          )
          status = g.provider_status()
          assert "openai/gpt-oss-120b" in status
          assert "qwen/qwen3.8-27b" in status
          assert "openai/gpt-oss-20b" in status
          assert "Mistral/mistral-small-latest" in status
          assert "Gemini" not in status
          assert "OpenRouter" not in status
          print("command cleanup/free AI wiring smoke test OK")
          PY

      - name: Crocodile game smoke test
        run: |
          python - <<'PY'
          import os
          import tempfile
          from bot import AksakalBot
          from db import Database

          from generator import PhraseGenerator

          assert len(AksakalBot.CROCODILE_WORDS) >= 30
          assert AksakalBot.normalize_crocodile_guess("САМОЛЁТ!!!") == "самолет"
          keyboard = AksakalBot.crocodile_keyboard()
          callbacks = [
              button["callback_data"]
              for row in keyboard["inline_keyboard"]
              for button in row
          ]
          assert "set:croc:hint" in callbacks
          assert "set:croc:stop" in callbacks

          fd, path = tempfile.mkstemp(suffix=".db")
          os.close(fd)
          try:
              db = Database(path)
              db.ensure_chat(-100777, "Игра", 3, 10, 180)
              db.start_crocodile_game(-100777)
              game = db.get_crocodile_game(-100777)
              assert game and game["active"] == 1

              db.set_crocodile_round(-100777, "арбуз")
              game = db.get_crocodile_game(-100777)
              assert game["word"] == "арбуз"
              assert game["round_number"] == 1
              assert db.register_crocodile_attempt(-100777) == 1
              assert db.advance_crocodile_clue(-100777) == 1

              assert db.add_crocodile_score(-100777, 42, "Магомед") == 1
              assert db.add_crocodile_score(-100777, 42, "Магомед") == 2
              top = db.crocodile_top(-100777)
              assert top[0]["user_id"] == 42 and top[0]["score"] == 2

              db.stop_crocodile_game(-100777)
              assert db.get_crocodile_game(-100777)["active"] == 0
          finally:
              try:
                  os.remove(path)
              except FileNotFoundError:
                  pass
          print("Crocodile game smoke test OK")
          PY

      - name: Natural game start, rating and Cities smoke test
        run: |
          python - <<'PY'
          import os
          import tempfile
          from bot import AksakalBot
          from db import Database

          assert AksakalBot.detect_game_request("давай играть в крокодила") == "crocodile"
          assert AksakalBot.detect_game_request("давайте сыграем в города") == "cities"
          assert AksakalBot.detect_game_request("играть в города") == "cities"
          assert AksakalBot.detect_game_request("может играть в города") == "cities"
          assert AksakalBot.detect_game_request("rating") == "rating"
          assert AksakalBot.detect_game_request("покажи рейтинг") == "rating"
          assert AksakalBot.detect_game_request("закончи игру") == "stop"
          assert AksakalBot.detect_game_request("хватит играть") == "stop"
          assert AksakalBot.city_last_letter("Астрахань") == "н"
          assert AksakalBot.city_last_letter("Тверь") == "р"
          assert len(AksakalBot.CITY_NAMES) >= 100

          fd, path = tempfile.mkstemp(suffix=".db")
          os.close(fd)
          try:
              db = Database(path)
              db.ensure_chat(-100888, "Игры", 3, 10, 180)
              db.start_city_game(-100888, "Москва", "а")
              game = db.get_city_game(-100888)
              assert game and game["active"] == 1
              assert game["required_letter"] == "а"

              db.update_city_game(-100888, "Анапа", "а", ["москва", "анапа"])
              game = db.get_city_game(-100888)
              assert game["current_city"] == "Анапа"
              assert game["round_number"] == 2

              assert db.add_city_score(-100888, 7, "Али") == 1
              assert db.add_city_score(-100888, 7, "Али") == 2
              top = db.city_top(-100888)
              assert top[0]["user_id"] == 7 and top[0]["score"] == 2

              db.stop_city_game(-100888)
              assert db.get_city_game(-100888)["active"] == 0
          finally:
              try:
                  os.remove(path)
              except FileNotFoundError:
                  pass
          print("natural game/rating/cities smoke test OK")
          PY

      - name: Full game system smoke test
        run: |
          python - <<'PY'
          import os
          import tempfile
          import time

          from bot import AksakalBot
          from db import Database

          assert AksakalBot.detect_game_request("давай играть") == "center"
          assert AksakalBot.detect_game_request("давай в виселицу") == "hangman"
          assert AksakalBot.detect_game_request("давай викторину") == "quiz"
          assert AksakalBot.detect_game_request("давай сыграем кто я") == "whoami"
          assert AksakalBot.detect_game_request("пропусти слово") == "skip"
          assert AksakalBot.detect_game_request("моя статистика") == "mystats"
          assert AksakalBot.detect_game_request("рейтинг недели") == "rating_week"

          kb = AksakalBot.game_center_keyboard()
          callbacks = [
              b["callback_data"]
              for row in kb["inline_keyboard"]
              for b in row
          ]
          for expected in (
              "set:game:croc",
              "set:game:cities",
              "set:game:hangman",
              "set:game:quiz",
              "set:game:whoami",
              "set:game:rating",
              "set:game:mystats",
          ):
              assert expected in callbacks

          rating_callbacks = [
              b["callback_data"]
              for row in AksakalBot.rating_keyboard()["inline_keyboard"]
              for b in row
          ]
          for expected in (
              "set:rating:all",
              "set:rating:week",
              "set:rating:croc",
              "set:rating:cities",
              "set:rating:hangman",
              "set:rating:quiz",
              "set:rating:whoami",
          ):
              assert expected in rating_callbacks

          assert len(AksakalBot.CROCODILE_WORDS) >= 60
          assert set(AksakalBot.CROCODILE_LEVELS) == {1, 2, 3}
          assert len(AksakalBot.CITY_NAMES) >= 250
          assert AksakalBot.resolve_city("махачькала") == "Махачкала"
          assert AksakalBot.resolve_city("ростов на дону") == "Ростов-на-Дону"
          assert AksakalBot.hangman_pattern("океан", "оа") == "О _ _ А _"

          fd, path = tempfile.mkstemp(suffix=".db")
          os.close(fd)
          try:
              db = Database(path)
              chat_id = -100999
              db.ensure_chat(chat_id, "Игры", 3, 10, 180)

              db.start_game_session(chat_id, "crocodile", target_score=10, reset=True)
              for n in range(9):
                  result = db.award_game_point(chat_id, "crocodile", 1, "Али")
                  assert result["session_score"] == n + 1
                  assert not result["won"]
              result = db.award_game_point(chat_id, "crocodile", 1, "Али")
              assert result["session_score"] == 10 and result["won"]
              final = db.register_game_session_win(chat_id, "crocodile", 1, "Али")
              assert final["wins"] == 1
              assert final["points"] == 10
              assert final["correct"] == 10
              assert final["games_played"] == 1
              assert final["best_streak"] == 10

              db.start_game_session(chat_id, "cities", target_score=10, reset=True)
              city = db.award_game_point(chat_id, "cities", 2, "Магомед")
              assert city["session_score"] == 1

              rating = db.game_rating(chat_id)
              assert rating[0]["user_id"] == 1 and rating[0]["points"] == 10
              croc_rating = db.game_rating(chat_id, game="crocodile")
              assert croc_rating[0]["wins"] == 1

              weekly = db.weekly_game_rating(chat_id, int(time.time()) - 3600)
              assert weekly and weekly[0]["user_id"] == 1

              db.start_crocodile_game(chat_id)
              db.set_crocodile_round(chat_id, "арбуз")
              state = db.get_crocodile_game(chat_id)
              assert state["difficulty"] == 1
              assert state["skip_used"] == 0
              assert db.use_crocodile_skip(chat_id) is True
              assert db.use_crocodile_skip(chat_id) is False
              db.set_crocodile_round(chat_id, "самолёт")
              assert db.get_crocodile_game(chat_id)["skip_used"] == 0
              assert db.update_crocodile_difficulty(chat_id, True) == 1
              assert db.update_crocodile_difficulty(chat_id, True) == 2

              db.set_hangman_round(chat_id, "океан", "вода")
              assert db.get_hangman_game(chat_id)["active"] == 1
              db.update_hangman_game(chat_id, "оа", 1)
              assert db.get_hangman_game(chat_id)["misses"] == 1
              db.clear_hangman_round(chat_id)
              assert db.get_hangman_game(chat_id)["word"] == ""

              db.set_quiz_round(chat_id, "q1", "7", "Сколько?", "5\n6\n7\n8")
              assert db.get_quiz_game(chat_id)["answer"] == "7"
              assert db.add_quiz_attempt(chat_id) == 1
              db.clear_quiz_round(chat_id)
              assert db.get_quiz_game(chat_id)["answer"] == ""

              db.set_whoami_round(chat_id, "Юрий Гагарин")
              assert db.get_whoami_game(chat_id)["answer"] == "Юрий Гагарин"
              assert db.advance_whoami_clue(chat_id) == 1
