name: Python check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile bot.py config.py db.py generator.py
      - name: Smoke test generator signature
        run: |
          python - <<'PY'
          import inspect
          from generator import PhraseGenerator
          sig = inspect.signature(PhraseGenerator.generate)
          required = {"recent_bot_replies", "relevant_memory", "source_text", "source_kind"}
          missing = required - set(sig.parameters)
          assert not missing, f"Missing generator parameters: {missing}"
          import asyncio
          g = PhraseGenerator(
              "", "", False,
              openrouter_models="qwen/qwen3.8-27b:free,deepseek/deepseek-chat-v3-0324:free,openrouter/free",
              groq_model="qwen/qwen3.8-27b",
          )
          assert "AI НЕ НАСТРОЕН" in g.provider_status()

          async def main():
              text = await g.generate(
                  target={"display_name": "Магомед", "style_profile": "male"},
                  context=[{"kind": "message", "content": "Купил машину", "display_name": "Магомед"}],
                  level=3,
                  reason="test",
                  source_text="Купил машину",
                  source_kind="message",
                  recent_bot_replies=["Магомед — старый ответ."],
                  relevant_memory=[{"display_name": "Магомед", "content": "Раньше говорил про машину"}],
              )
              assert text == "", text
          asyncio.run(main())
          print("generator smoke test OK")
          PY

      - name: Smoke test database and bot wiring
        run: |
          python - <<'PY'
          import os
          import tempfile
          from db import Database
          from bot import AksakalBot

          fd, path = tempfile.mkstemp(suffix=".db")
          os.close(fd)
          try:
              db = Database(path)
              db.ensure_chat(-100123, "Тест", 3, 10, 180)
              db.update_chat(-100123, response_delay_seconds=3, hardness_mode="fixed", fixed_hardness=5)
              chat = db.get_chat(-100123)
              assert chat["response_delay_seconds"] == 3
              assert chat["fixed_hardness"] == 5

              user = {"id": 42, "username": "testuser", "first_name": "Магомед"}
              uid = db.touch_user(-100123, user, "message")
              assert uid == 42
              db.add_message(-100123, 1, uid, "testuser", "Магомед", "message", "Купил новую машину")
              db.add_bot_message(-100123, 2, "Магомед — тестовый ответ")
              assert db.recent_context(-100123, 10)
              assert db.recent_bot_replies(-100123, 5)
              assert db.relevant_messages(-100123, "машина", 5)

              kb = AksakalBot.settings_keyboard(chat)
              callbacks = [
                  btn["callback_data"]
                  for row in kb["inline_keyboard"]
                  for btn in row
              ]
              assert "set:hard:5" in callbacks
              assert "set:time:3" in callbacks
              print("database/bot smoke test OK")
          finally:
              for suffix in ("", "-shm", "-wal"):
                  try:
                      os.remove(path + suffix)
                  except FileNotFoundError:
                      pass
          PY
